name: Build FolderSecurityViewer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: .NET 9 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Anwendung kompilieren (Single-File EXE)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Binary als ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FolderSecurityViewer-win-x64
          path: ./publish

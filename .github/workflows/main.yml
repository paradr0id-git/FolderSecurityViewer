name: Build FolderSecurityViewer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v5

      - name: .NET 9 SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Anwendung kompilieren (Single-File EXE)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -notmatch "Test|Core|Common|Shared|Model|Cli|Console" } | Select-Object -First 1
          if (-not $proj) { $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1 }
          Write-Host "Gefundenes Projekt: $($proj.FullName)"
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o ./publish

      - name: Binary als ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FolderSecurityViewer-win-x64
          path: ./publish
